<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-0:#05070f; --bg-1:#0a1226; --glow:#1e6cff;
    --panel-2:rgba(120,140,190,0.16); --panel-head:rgba(70,90,140,0.42);
    --stroke:rgba(160,185,255,0.45); --stroke-soft:rgba(160,185,255,0.22);
    --text:#f4f7ff; --text-dim:#c3ccea; --ink:#0c1326;
    --radius:26px; --shadow:0 30px 80px -30px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:'Nunito',sans-serif; color:var(--text);
    background:
      radial-gradient(900px 600px at 88% -8%, rgba(30,108,255,.55), transparent 60%),
      radial-gradient(700px 500px at 6% 92%, rgba(30,60,160,.45), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-0) 70%);
    background-attachment:fixed; min-height:100vh; padding:28px 18px 56px; -webkit-font-smoothing:antialiased;
  }
  .report-title{
    text-align:center; font-family:'Quicksand',sans-serif; font-weight:700;
    font-size:clamp(30px,5.4vw,62px); letter-spacing:.5px; margin:6px auto 4px;
    /* Removed the underline properties from here */
    text-shadow:0 2px 30px rgba(40,110,255,.35);
  }
  /* Increased the font-size of report-sub to 22px */
  .report-sub{text-align:center;color:var(--text-dim);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:22px;margin-bottom:10px;}
  
  #syncBar{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .sync-refresh{background:rgba(120,140,190,.18);border:1px solid var(--stroke-soft);color:var(--text-dim);font-weight:800;font-size:12px;border-radius:999px;padding:5px 13px;cursor:pointer;font-family:'Nunito';transition:background .2s;}
  .sync-refresh:hover{background:rgba(120,140,190,.32);}

  .stage{max-width:1320px;margin:0 auto;display:flex;align-items:stretch;gap:14px;}
  .nav-btn{flex:0 0 auto;align-self:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--stroke);background:rgba(120,140,190,.18);color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:transform .15s,background .2s;}
  .nav-btn:hover{background:rgba(120,140,190,.35);transform:scale(1.08);}
  .nav-btn:active{transform:scale(.94);}
  .board{flex:1 1 auto;border:1px solid var(--stroke);border-radius:var(--radius);background:linear-gradient(180deg,rgba(120,140,190,.20),rgba(70,90,140,.10));box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(10px);}
  .board-head{text-align:center;font-family:'Quicksand',sans-serif;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:14px;font-size:18px;background:var(--panel-head);border-bottom:1px solid var(--stroke-soft);}
  .board-body{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;padding:18px;}
  @media(max-width:860px){.board-body{grid-template-columns:1fr;}}
  .card{border:1px solid var(--stroke-soft);border-radius:20px;background:var(--panel-2);overflow:hidden;display:flex;flex-direction:column;}
  .card-head{text-align:center;font-family:'Quicksand',sans-serif;font-weight:700;font-size:19px;padding:12px;border-bottom:1px solid var(--stroke-soft);background:rgba(120,140,190,.12);}
  .right-col{display:flex;flex-direction:column;gap:18px;}

  .gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;align-content:start;gap:14px;padding:16px;flex:1 1 auto;min-height:0;max-height:640px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(160,185,255,.45) transparent;}
  .gallery-grid::-webkit-scrollbar{width:9px;}
  .gallery-grid::-webkit-scrollbar-thumb{background:rgba(160,185,255,.35);border-radius:999px;border:2px solid transparent;background-clip:padding-box;}
  @media(max-width:520px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}
  .cell{position:relative;aspect-ratio:1/1;border-radius:16px;background:#dadde3;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .cell.empty{background:rgba(215,219,228,.85);}
  .cell.filled{cursor:pointer;}
  .cell .thumb{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#dadde3;}
  .cell .thumb img,.cell .thumb video,.cell .thumb canvas{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s;}
  .cell.filled:hover .thumb img,.cell.filled:hover .thumb video,.cell.filled:hover .thumb canvas{transform:scale(1.06);}
  .thumb .pdfcanvas{object-fit:cover;object-position:top;background:#fff;}
  .thumb .pdftag{position:absolute;left:8px;bottom:8px;background:#f0353b;color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:6px;}
  .thumb .drivetag{position:absolute;left:8px;bottom:8px;background:#1a73e8;color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:6px;}
  .thumb .odtag{position:absolute;left:8px;bottom:8px;background:#0364b8;color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:6px;}
  .thumb .drivepreview{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#1b2540;}
  .thumb .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);}
  .thumb .play::after{content:"";position:absolute;top:50%;left:54%;transform:translate(-50%,-50%);border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent #fff;}
  .thumb.filecard{flex-direction:column;gap:8px;background:linear-gradient(160deg,#2a3653,#1b2540);color:#dde6ff;padding:10px;text-align:center;}
  .thumb.filecard .ic{font-size:34px;}
  .thumb.filecard .fn{font-size:11px;font-weight:700;line-height:1.2;max-height:2.4em;overflow:hidden;word-break:break-word;opacity:.85;}

  .donut-wrap{padding:16px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .donut-svg{width:100%;max-width:300px;height:auto;overflow:visible;}
  .donut-svg path{transition:opacity .2s;cursor:default;}
  .donut-svg path:hover{opacity:.85;}
  .seg-label{font-family:'Nunito';font-weight:800;font-size:15px;fill:#fff;pointer-events:none;}
  .center-label{font-family:'Quicksand';font-weight:700;fill:var(--text-dim);text-anchor:middle;}
  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
  .legend .pill{display:flex;align-items:center;gap:7px;background:rgba(230,234,245,.92);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;}
  .legend .dot{width:11px;height:11px;border-radius:50%;}

  .people{padding:20px 16px 24px;display:flex;justify-content:space-around;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .person{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1 1 0;min-width:78px;text-align:center;}
  .pct{font-family:'Quicksand',sans-serif;font-weight:700;font-size:clamp(30px,4.4vw,48px);line-height:1;letter-spacing:-.5px;}
  .pname{font-weight:800;font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}

  .dots{display:flex;justify-content:center;gap:9px;margin-top:18px;}
  .dots button{width:10px;height:10px;border-radius:50%;border:none;background:rgba(180,195,240,.35);cursor:pointer;padding:0;transition:.2s;}
  .dots button.on{background:#fff;transform:scale(1.25);}

  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:none;align-items:center;justify-content:center;padding:30px;}
  #lightbox.show{display:flex;}
  #lightboxStage{max-width:94vw;max-height:92vh;display:flex;align-items:center;justify-content:center;}
  #lightboxStage img{max-width:94vw;max-height:92vh;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.7);}
  #lightboxStage video{max-width:94vw;max-height:92vh;border-radius:12px;background:#000;}
  #lightboxStage iframe{width:min(94vw,1100px);height:min(86vh,760px);border:none;border-radius:12px;background:#fff;}
  #lightboxClose{position:fixed;top:18px;right:22px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;z-index:81;}
</style>

<h1 class="report-title" id="titleEl">Loading...</h1>
<div class="report-sub" id="subEl"></div>
<div id="syncBar">
  <button class="sync-refresh" id="refreshBtn">↻ Refresh</button>
  <select id="monthSelect" class="sync-refresh" style="outline: none; padding-right: 25px;"></select>
</div>

<div class="stage">
  <button class="nav-btn" id="prevBtn" aria-label="Previous brand">‹</button>
  <div class="board">
    <div class="board-head" id="brandName">—</div>
    <div class="board-body">
      <div class="card">
        <div class="card-head">Gallery</div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
      <div class="right-col">
        <div class="card">
          <div class="card-head">Brands Workload Overall</div>
          <div class="donut-wrap">
            <svg class="donut-svg" id="donut" viewBox="0 0 220 220"></svg>
            <div class="legend" id="legend"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head">Workload Per Person</div>
          <div class="people" id="people"></div>
        </div>
      </div>
    </div>
  </div>
  <button class="nav-btn" id="nextBtn" aria-label="Next brand">›</button>
</div>
<div class="dots" id="dots"></div>

<div id="lightbox">
  <button id="lightboxClose" aria-label="Close">✕</button>
  <div id="lightboxStage"></div>
</div>

<script>
(function(){
  "use strict";
  const API = "/.netlify/functions/data";
  
  let config=null;
  const galleries={};
  let current=0;
  let availableMonths = []; 
  let selectedMonthKey = "state"; 

  function buildGalleries(src){
    config.brands.forEach(b=>{
      const arr=(src[b.id]||[]);
      galleries[b.id]=arr.map(entry => {
        if(entry.kind==="upload") return entry;
        return Object.assign({id:entry.id, kind:"link", name:entry.url, data:entry.url}, classifyUrl(entry.url));
      });
    });
  }

  function classifyUrl(url){
    const u=(url||"").trim();
    if(/drive\.google\.com\/drive\/folders\//.test(u)) return {type:"gdrive",folder:true};
    let g=u.match(/docs\.google\.com\/\w+\/d\/([\w-]+)/); if(g) return {type:"gdrive",gid:g[1]};
    g=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);   if(g) return {type:"gdrive",gid:g[1]};
    g=u.match(/[?&]id=([\w-]+)/); if(g && /(drive|docs)\.google\.com/.test(u)) return {type:"gdrive",gid:g[1]};
    if(/1drv\.ms\//i.test(u) || /onedrive\.live\.com/i.test(u) || /\.sharepoint\.com/i.test(u)){
      const isImg=/\/download/i.test(u) || /[?&]download=1/i.test(u) || /\.(png|jpe?g|gif|webp|bmp)(\?|#|$)/i.test(u);
      return {type:"onedrive",odmode:isImg?"image":"embed"};
    }
    let m=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/); if(m) return {type:"video",provider:"youtube",vid:m[1]};
    m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/); if(m) return {type:"video",provider:"vimeo",vid:m[1]};
    if(/\.(mp4|webm|ogg|mov|m4v)(\?|#|$)/i.test(u)) return {type:"video",provider:"file"};
    if(/\.pdf(\?|#|$)/i.test(u)) return {type:"pdf"};
    if(/\.(png|jpe?g|gif|webp|svg|avif|bmp)(\?|#|$)/i.test(u)) return {type:"image"};
    return {type:"pdf"};
  }

  async function load(){
    try{
      const listRes = await fetch(API + "?action=list", {cache:"no-store"});
      if (listRes.ok) {
        const listData = await listRes.json();
        availableMonths = listData.keys || ["state"];
        if (availableMonths.length === 0) availableMonths = ["state"];
      }

      const res=await fetch(API + "?month=" + encodeURIComponent(selectedMonthKey),{cache:"no-store"});
      if(res.ok){
        const state=await res.json();
        if(state && state.brands) {
            config={meta:state.meta,brands:state.brands,donut:state.donut,people:state.people||{}};
            config.brands.forEach(b=>{ if(!config.people[b.id]) config.people[b.id]=[]; });
            buildGalleries(state.gallery||{});
            if (selectedMonthKey !== "state" && config.meta.sub) {
                selectedMonthKey = config.meta.sub;
            }
        }
      }
    }catch(e){ console.error("Could not load data"); }
  }

  /* Drawing functions */
  function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
  function arc(cx,cy,ro,ri,start,end){
    const so=polar(cx,cy,ro,end),eo=polar(cx,cy,ro,start),si=polar(cx,cy,ri,start),ei=polar(cx,cy,ri,end);
    const large=(end-start)<=180?0:1;
    return ["M",so.x,so.y,"A",ro,ro,0,large,0,eo.x,eo.y,"L",si.x,si.y,"A",ri,ri,0,large,1,ei.x,ei.y,"Z"].join(" ");
  }
  function renderDonut(){
    const svg=document.getElementById("donut"),legend=document.getElementById("legend");
    svg.innerHTML="";legend.innerHTML="";
    const data=(config.donut||[]).filter(d=>Number(d.value)>0);
    const total=data.reduce((s,d)=>s+Number(d.value),0)||1;
    const cx=110,cy=110,ro=92,ri=52,gap=2.2;let angle=0;
    data.forEach(d=>{
      const sweep=(Number(d.value)/total)*360,s=angle+gap/2,e=angle+sweep-gap/2;
      if(e>s){
        const p=document.createElementNS("http://www.w3.org/2000/svg","path");
        p.setAttribute("d",arc(cx,cy,ro,ri,s,e));p.setAttribute("fill",d.color);
        svg.appendChild(p);
        const mid=(s+e)/2,lp=polar(cx,cy,(ro+ri)/2,mid);
        const t=document.createElementNS("http://www.w3.org/2000/svg","text");
        t.setAttribute("x",lp.x);t.setAttribute("y",lp.y+5);t.setAttribute("text-anchor","middle");t.setAttribute("class","seg-label");
        t.textContent=Math.round(Number(d.value)/total*100)+"%";svg.appendChild(t);
      }
      angle+=sweep;
      const pill=document.createElement("div");pill.className="pill";
      pill.innerHTML='<span class="dot" style="background:'+d.color+'"></span>'+escapeHtml(d.label);legend.appendChild(pill);
    });
    const c=document.createElementNS("http://www.w3.org/2000/svg","text");
    c.setAttribute("x",cx);c.setAttribute("y",cy+4);c.setAttribute("class","center-label");c.setAttribute("font-size","13");
    c.textContent=(config.meta.sub||"").toUpperCase();svg.appendChild(c);
  }

  function addTag(wrap,cls,txt){const t=document.createElement("span");t.className=cls;t.textContent=txt;wrap.appendChild(t);}
  function buildThumb(it,brandName){
    const wrap=document.createElement("div");wrap.className="thumb";
    if(it.type==="image"){
      const im=document.createElement("img");im.src=it.data;im.alt=brandName;im.loading="lazy";wrap.appendChild(im);
    } else if(it.type==="gdrive"){
      if(it.folder){wrap.classList.add("filecard");wrap.innerHTML='<span class="ic">📁</span><span class="fn">Drive</span>';addTag(wrap,"drivetag","DRIVE");}
      else{
        const im=document.createElement("img");im.loading="lazy";im.referrerPolicy="no-referrer";
        const srcs=["https://drive.google.com/thumbnail?id="+it.gid+"&sz=w1000"];
        im.onerror=()=>{im.remove();const fr=document.createElement("iframe");fr.className="drivepreview";fr.src="https://drive.google.com/file/d/"+it.gid+"/preview";fr.setAttribute("scrolling","no");wrap.appendChild(fr);};
        im.src=srcs[0];wrap.appendChild(im);addTag(wrap,"drivetag","DRIVE");
      }
    } else if(it.type==="video"){
      if(it.provider==="youtube"){const im=document.createElement("img");im.src="https://img.youtube.com/vi/"+it.vid+"/hqdefault.jpg";im.loading="lazy";wrap.appendChild(im);}
      else if(it.provider==="file"&&it.kind==="upload"){const v=document.createElement("video");v.src=it.data;v.muted=true;wrap.appendChild(v);}
      else{wrap.classList.add("filecard");wrap.innerHTML='<span class="ic">🎬</span>';}
      const play=document.createElement("span");play.className="play";wrap.appendChild(play);
    } else if(it.type==="pdf"){
      wrap.classList.add("filecard");wrap.innerHTML='<span class="ic">📄</span><span class="fn">PDF</span>';
    }
    return wrap;
  }
  function renderGallery(){
    const grid=document.getElementById("galleryGrid");grid.innerHTML="";
    const b=config.brands[current],items=galleries[b.id]||[];
    const slots=items.length>0?items.length:9;
    for(let i=0;i<slots;i++){
      const cell=document.createElement("div");const it=items[i];
      if(it){cell.className="cell filled";cell.appendChild(buildThumb(it,b.name));cell.addEventListener("click",()=>openMedia(it));}
      else{cell.className="cell empty";}
      grid.appendChild(cell);
    }
  }
  function renderPeople(){
    const wrap=document.getElementById("people");wrap.innerHTML="";
    const b=config.brands[current],arr=config.people[b.id]||[];
    const total=arr.reduce((s,p)=>s+Number(p.value),0)||1;
    arr.forEach(p=>{
      const pct=Math.round(Number(p.value)/total*100);
      const item=document.createElement("div");item.className="person";
      item.innerHTML='<span class="pct" style="color:'+p.color+'">'+pct+'%</span><span class="pname">'+escapeHtml(p.name)+'</span>';
      wrap.appendChild(item);
    });
  }
  function renderDots(){
    const dots=document.getElementById("dots");dots.innerHTML="";
    config.brands.forEach((b,i)=>{
      const btn=document.createElement("button");btn.className=i===current?"on":"";btn.title=b.name;
      btn.addEventListener("click",()=>{current=i;renderBoard();});dots.appendChild(btn);
    });
  }
  function renderBoard(){
    if(!config || !config.brands.length) return;
    current=(current+config.brands.length)%config.brands.length;
    document.getElementById("brandName").textContent=config.brands[current].name;
    renderGallery();renderPeople();renderDots();
  }
  function renderMonthDropdown() {
     const select = document.getElementById("monthSelect");
     if (!select) return;
     select.innerHTML = "";
     if (!availableMonths.includes(selectedMonthKey)) availableMonths.push(selectedMonthKey);
     availableMonths.forEach(m => {
         const opt = document.createElement("option");
         opt.value = m;
         opt.textContent = m === "state" ? "Default Data" : m;
         if (m === selectedMonthKey) opt.selected = true;
         select.appendChild(opt);
     });
     select.onchange = async (e) => {
         selectedMonthKey = e.target.value;
         await load();
         renderAll();
     };
  }
  function renderAll(){
    if (!config) return;
    document.getElementById("titleEl").textContent=config.meta.title||"";
    document.getElementById("subEl").textContent=config.meta.sub||"";
    renderDonut();renderBoard();renderMonthDropdown();
  }
  
  /* Events */
  document.getElementById("prevBtn").onclick=()=>{current--;renderBoard();};
  document.getElementById("nextBtn").onclick=()=>{current++;renderBoard();};
  document.getElementById("refreshBtn").addEventListener("click", async ()=>{ await load(); renderAll(); });
  document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"){current--;renderBoard();}
    if(e.key==="ArrowRight"){current++;renderBoard();}
  });
  
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  /* Lightbox */
  const lightbox=document.getElementById("lightbox"),lightboxStage=document.getElementById("lightboxStage");
  function openMedia(it){
    lightboxStage.innerHTML="";
    if(it.type==="image"){const im=document.createElement("img");im.src=it.data;lightboxStage.appendChild(im);}
    else if(it.type==="pdf"){const f=document.createElement("iframe");f.src=it.data;lightboxStage.appendChild(f);}
    else if(it.type==="gdrive"){if(it.folder){window.open(it.data,"_blank","noopener");return;}const f=document.createElement("iframe");f.src="https://drive.google.com/file/d/"+it.gid+"/preview";f.allow="autoplay; fullscreen";f.allowFullscreen=true;lightboxStage.appendChild(f);}
    else if(it.type==="video"){
      if(it.provider==="youtube"){const f=document.createElement("iframe");f.src="https://www.youtube.com/embed/"+it.vid+"?autoplay=1";f.allow="autoplay; fullscreen";f.allowFullscreen=true;lightboxStage.appendChild(f);}
      else{const v=document.createElement("video");v.src=it.data;v.controls=true;v.autoplay=true;lightboxStage.appendChild(v);}
    }
    lightbox.classList.add("show");
  }
  function closeLightbox(){lightbox.classList.remove("show");lightboxStage.innerHTML="";}
  lightbox.addEventListener("click",e=>{if(e.target===lightbox)closeLightbox();});
  document.getElementById("lightboxClose").addEventListener("click",closeLightbox);

  load().then(renderAll);
})();
</script>
